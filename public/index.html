<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Belépés — zozz-sandbox</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Belépés</h1>
    <form id="login-form" novalidate>
      <label>E-mail cím <input name="email" type="email" autocomplete="username" required></label>
      <div class="password-field">
        <label>Jelszó <input id="password" name="password" type="password" autocomplete="current-password" required
          spellcheck="false" autocapitalize="none" autocorrect="off"></label>
        <button id="password-toggle" type="button" aria-controls="password">Mutat</button>
        <span id="password-status" class="visually-hidden" aria-live="polite"></span>
      </div>
      <details id="forgot-password">
        <summary>Elfelejtett jelszó?</summary>
        <p>Új jelszó kéréséhez írjon a <a href="mailto:support@example.com?subject=Elfelejtett%20jelsz%C3%B3">support@example.com</a> címre arról az e-mail címről, amellyel belép.</p>
      </details>
      <button id="login-button" type="submit">Belépés</button>
      <span id="spinner" hidden>Belépés folyamatban…</span>
      <p id="error" role="alert" hidden></p>
    </form>
  </main>
  <script type="module" src="/login.js"></script>
</body>
</html>
